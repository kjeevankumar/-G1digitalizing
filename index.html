    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- JSON-LD Structured Data for Google Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "G1 Digitalizing",
      "image": "https://g1digitalizing.com/favicon.svg",
      "description": "Premium engineering & growth agency building high-conversion business websites, automated sales funnels, and digital memory algorithms.",
      "url": "https://g1digitalizing.com",
      "telephone": "+917816006648",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "sameAs": [
        "https://wa.me/917816006648"
      ],
      "offers": {
        "@type": "Offer",
        "category": "Digital Growth Systems & Web Engineering"
      }
    }
    </script>
  </head>
  <body class="enable-backgrounds">
    <!-- Premium Global Initial Loader -->
    <div id="premium-loader" style="position: fixed; inset: 0; background: #ffffff; z-index: 9999999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;">
      
      <!-- Elegant Logo Reveal -->
      <div style="overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 10px;">
        <img src="src/assets/logo.webp" alt="G1 Logo" style="height: 160px; width: auto; object-fit: contain; opacity: 0; transform-origin: bottom; animation: logoFloatReveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;" />
      </div>
      
      <!-- Sharp Typography Reveal -->
      <div style="font-weight: 800; font-family: Inter, system-ui, sans-serif; font-size: 20px; letter-spacing: 8px; color: #0f172a; text-transform: uppercase; overflow: hidden; padding-bottom: 5px;">
        <div style="opacity: 0; transform: translateY(100%); animation: textSlideReveal 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;">
          G1 DIGITALIZING
        </div>
      </div>

    </div>
    <style>
      @keyframes logoFloatReveal {
        0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
        100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }
      @keyframes textSlideReveal {
        0% { opacity: 0; transform: translateY(100%); }
        100% { opacity: 1; transform: translateY(0); }
      }
    </style>
    <div id="root"></div>

    <!-- Fail-safe Pre-loader Handler -->
    <script>
      (function() {
        var forceHideLoader = function() {
          var loader = document.getElementById('premium-loader');
          if (loader && loader.style.display !== 'none') {
            loader.style.opacity = '0';
            setTimeout(function() {
              loader.style.display = 'none';
            }, 600);
          }
          var rootEl = document.getElementById('root');
          if (rootEl && !rootEl.classList.contains('loaded')) {
            rootEl.classList.add('loaded');
          }
        };
        // Safeguard: Hide loader after 2.5s under any condition
        setTimeout(forceHideLoader, 2500);
        // Hide loader when loading finishes
        window.addEventListener('load', forceHideLoader);
      })();
    </script>

    <!-- Visual Error Diagnostics Overlay for live troubleshooting -->
    <div id="debug-error-overlay" style="display: none; position: fixed; top: 10px; left: 10px; right: 10px; background: rgba(239, 68, 68, 0.95); color: #ffffff; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; z-index: 999999999; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto;">
      <h3 style="margin-top: 0; font-size: 14px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 8px; margin-bottom: 8px;">⚠️ Live Diagnostic Log</h3>
      <div id="debug-error-content"></div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var overlay = document.getElementById('debug-error-overlay');
        var content = document.getElementById('debug-error-content');
        if (overlay && content) {
          overlay.style.display = 'block';
          content.innerHTML += '<p style="margin: 4px 0;"><strong>Error:</strong> ' + e.message + '<br><small style="opacity: 0.8;">at ' + e.filename + ':' + e.lineno + ':' + e.colno + '</small></p>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var overlay = document.getElementById('debug-error-overlay');
        var content = document.getElementById('debug-error-content');
        if (overlay && content) {
          overlay.style.display = 'block';
          content.innerHTML += '<p style="margin: 4px 0;"><strong>Unhandled Promise Rejection:</strong> ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown reason') + '</p>';
        }
      });
    </script>

    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
