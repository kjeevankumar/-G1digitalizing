name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agency-website/package-lock.json

      - name: Install Dependencies 🔧
        run: npm ci
        working-directory: agency-website

      - name: Build Project 🏗️
        run: npm run build
        working-directory: agency-website

      - name: Upload to GitHub Pages Branch 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: agency-website/dist
          branch: gh-pages
